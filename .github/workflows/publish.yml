name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default. The publish job asks for the one extra token it
# needs, and only for itself.
permissions:
  contents: read

jobs:
  # Nothing reached PyPI through a test before this job existed: a tag push went
  # straight to build and upload, and a release cannot be unpublished. It stays
  # here rather than being replaced by ci.yml, because that one is triggered by
  # the commit and this one gates the upload - a release must not depend on a
  # run that happened to be green on some earlier push.
  test:
    name: Release check on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every version requires-python claims to support, so the claim is
        # checked rather than asserted.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # Third-party actions are pinned to a commit rather than a tag. A tag can
      # be moved to point at new code, and the job below hands an OIDC token
      # that publishes to PyPI under our name to whatever these actions run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # --extra dev, because pytest lives in an optional dependency rather than
      # in the default set: without it uv resolves an environment that cannot
      # run the suite at all.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Run tests
        run: uv run --extra dev --extra analyze --python ${{ matrix.python-version }} pytest
      - name: Build and verify isolated installation
        run: |
          uv build
          uv run --no-sync --python ${{ matrix.python-version }} python scripts/package_smoke.py
      - name: Check out the pinned legacy informational package
        if: matrix.python-version == '3.14'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0bbde9994f96878ab121f1b3d522bceb839cc44f
          path: .legacy-release
          persist-credentials: false
      - name: Verify pip, pipx and uv name migration
        if: matrix.python-version == '3.14'
        run: |
          uv build --project .legacy-release --out-dir .legacy-dist
          uv run --no-sync python scripts/tool_migration_smoke.py .legacy-dist/dj_soundcloud_digger-1.0.1-py3-none-any.whl dist/dj_digger-1.1.0-py3-none-any.whl --manager pip
          uv run --no-sync python scripts/tool_migration_smoke.py .legacy-dist/dj_soundcloud_digger-1.0.1-py3-none-any.whl dist/dj_digger-1.1.0-py3-none-any.whl --manager pipx
          uv run --no-sync python scripts/tool_migration_smoke.py .legacy-dist/dj_soundcloud_digger-1.0.1-py3-none-any.whl dist/dj_digger-1.1.0-py3-none-any.whl --manager uv

  pypi-publish:
    name: Upload release to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # IMPORTANT: Mandatory for PyPI Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check specification section map
        run: python3 scripts/spec_section_map.py --check
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
